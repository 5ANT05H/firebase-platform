<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crimson Devil World - Premium Interface</title>
    <style>
        :root {
            --crimson: #dc143c;
            --bg-glass: rgba(20, 20, 22, 0.95);
            --border-glow: 0 0 15px rgba(220, 20, 60, 0.4);
        }

        body { 
            background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
        }

        /* PREMIUM MODAL STYLE */
        .modal-window {
            width: 90%; max-width: 800px; height: 80vh;
            background: var(--bg-glass); border: 1px solid var(--crimson);
            border-radius: 20px; box-shadow: var(--border-glow);
            position: relative; overflow: hidden; display: flex; flex-direction: column;
            animation: modalPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* CLOSE 'X' BUTTON */
        .close-btn {
            position: absolute; top: 15px; right: 20px;
            font-size: 24px; cursor: pointer; color: var(--crimson);
            font-weight: bold; transition: 0.3s;
        }
        .close-btn:hover { color: #fff; transform: rotate(90deg); }

        .content-area { padding: 40px; flex: 1; overflow-y: auto; }
        
        /* बाकी सब स्टाइलिंग वही है जो हमने पहले सेट की थी */
        h2 { text-align: center; color: var(--crimson); margin-bottom: 30px; text-transform: uppercase; letter-spacing: 3px; }
        .input-field { background: rgba(255,255,255,0.05); border: 1px solid #444; color: #fff; padding: 12px; width: 100%; border-radius: 8px; margin: 10px 0; }
        .btn-action { background: var(--crimson); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-action:hover { background: #ff2a55; box-shadow: 0 0 15px var(--crimson); }
    </style>
</head>
<body>

<div class="modal-window">
    <div class="close-btn" onclick="location.reload()">×</div>

    <div class="content-area">
        <h2 id="app-title">Crimson Devil World</h2>
        
        <div id="auth-section">
            <input type="text" id="login-username" class="input-field" placeholder="Username">
            <input type="password" id="login-password" class="input-field" placeholder="Password">
            <button class="btn-action" id="btn-login">Login</button>
        </div>

        <div id="dashboard-section" class="hidden">
            <div id="chat-tab">... (आपका चैट इंटरफ़ेस)</div>
        </div>
    </div>
</div>

<script type="module">
    // (Firebase Logic वही रहेगा जो मैंने पिछले कोड में दिया था)
    // बस यहाँ पर dashboard-section को un-hide करने का कोड वैसा ही है
</script>

</body>
</html>
