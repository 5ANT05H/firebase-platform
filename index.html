<!DOCTYPE html>
<html>
<head>
  <title>CRIMSON DEVIL WORLD</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:black;
      color:white;
      overflow:hidden;
    }

    /* DEVIL INTRO SCREEN */
    #intro{
      position:fixed;
      width:100%;
      height:100%;
      background:radial-gradient(circle,#1a0000,#000);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      animation:fadeOut 4s forwards;
      animation-delay:3s;
    }

    h1{
      font-size:40px;
      color:red;
      text-shadow:0 0 20px red,0 0 40px darkred;
      letter-spacing:3px;
      animation:glow 1s infinite alternate;
    }

    p{
      color:#ff4444;
      font-size:18px;
    }

    @keyframes glow{
      from{transform:scale(1);}
      to{transform:scale(1.1);}
    }

    @keyframes fadeOut{
      0%{opacity:1;}
      100%{opacity:0;visibility:hidden;}
    }

    /* LOGIN BOX */
    #app{
      display:none;
      height:100vh;
      justify-content:center;
      align-items:center;
    }

    .box{
      background:#111;
      padding:20px;
      border:1px solid red;
      box-shadow:0 0 20px red;
      border-radius:10px;
      text-align:center;
    }

    input{
      padding:10px;
      margin:5px;
      background:black;
      border:1px solid red;
      color:white;
    }

    button{
      padding:10px;
      margin-top:10px;
      background:red;
      border:none;
      color:white;
      cursor:pointer;
      box-shadow:0 0 10px red;
    }
  </style>
</head>

<body>

<!-- 🔥 INTRO -->
<div id="intro">
  <h1>🔥 CRIMSON DEVIL WORLD 🔥</h1>
  <p>Welcome to Dark System</p>
</div>

<!-- LOGIN -->
<div id="app">
  <div class="box">
    <h2>💀 LOGIN TO DEVIL WORLD</h2>

    <input id="username" placeholder="username"><br>
    <input id="password" type="password" placeholder="password"><br>

    <button onclick="login()">ENTER</button>
    <button onclick="signup()">SIGNUP</button>

    <div id="msg"></div>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAwyFcuUfpvu4DcXRMF-7VNPr6v39MniRU",
  authDomain: "crimson-platform-92f67.firebaseapp.com",
  projectId: "crimson-platform-92f67",
  storageBucket: "crimson-platform-92f67.firebasestorage.app",
  appId: "1:7775873440:web:b81205d0d1e84e12f3dcc5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = null;

/* SHOW LOGIN AFTER INTRO */
setTimeout(()=>{
  document.getElementById("intro").style.display="none";
  document.getElementById("app").style.display="flex";
},3000);

/* SIGNUP */
window.signup = async function(){

  let u = username.value;
  let p = password.value;

  if(!u||!p) return alert("fill fields");

  let ref = doc(db,"users",u);
  let snap = await getDoc(ref);

  if(snap.exists()) return alert("User exists");

  await setDoc(ref,{
    username:u,
    password:p,
    role:"USER",
    premium:false
  });

  alert("Signup success ✔");
};

/* LOGIN */
window.login = async function(){

  let u = username.value;
  let p = password.value;

  let ref = doc(db,"users",u);
  let snap = await getDoc(ref);

  if(!snap.exists()) return alert("User not found");

  let data = snap.data();

  if(data.password !== p) return alert("Wrong password");

  alert("WELCOME TO DEVIL WORLD 🔥");
};

</script>

</body>
</html>
