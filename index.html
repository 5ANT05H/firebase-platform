<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

/* ✅ YOUR FIREBASE CONFIG (FIXED) */
const firebaseConfig = {
  apiKey: "AIzaSyAwyFcuUfpvu4DcXRMF-7VNPr6v39MniRU",
  authDomain: "crimson-platform-92f67.firebaseapp.com",
  projectId: "crimson-platform-92f67",
  storageBucket: "crimson-platform-92f67.firebasestorage.app",
  messagingSenderId: "7775873440",
  appId: "1:7775873440:web:b81205d0d1e84e12f3dcc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

/* 💀 SAFE LOGIN (NO BLACK SCREEN) */
window.login = async function () {

  try {

    // loading state (prevents blank screen)
    document.getElementById("auth").innerHTML =
      "<h2 style='color:red'>💀 Logging in...</h2>";

    const result = await signInWithPopup(auth, provider);
    const user = result.user;

    console.log("LOGIN SUCCESS:", user.email);

    // SAFE UI SWITCH
    document.body.innerHTML = `
      <div style="
        background:black;
        color:red;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        font-family:Arial;
      ">
        <h1>💀 DEVIL WORLD</h1>
        <h2>Welcome ${user.displayName}</h2>
        <p>${user.email}</p>
      </div>
    `;

  } catch (e) {

    console.log(e);

    // ❌ NO BLACK SCREEN FIX
    document.getElementById("auth").innerHTML = `
      <h2 style="color:red">Login Failed</h2>
      <button onclick="location.reload()"
        style="padding:10px;background:red;color:white;border:none;">
        RETRY
      </button>
    `;

  }

};

</script>
