<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CRIMSON DEVIL WORLD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:white;
}

.top{
  padding:12px;
  background:black;
  border-bottom:2px solid red;
  text-align:center;
  font-weight:bold;
  color:red;
}

#chat{
  height:75vh;
  overflow:auto;
  padding:10px;
  background:#111;
}

.msg{
  background:black;
  margin:6px 0;
  padding:8px;
  border-left:3px solid red;
}

.input{
  display:flex;
}

input{
  flex:1;
  padding:12px;
  border:none;
  outline:none;
}

button{
  padding:12px;
  background:red;
  border:none;
  color:white;
  cursor:pointer;
}

.badge{
  font-size:10px;
  padding:2px 6px;
  margin-left:5px;
  border-radius:4px;
}

.owner{background:gold;color:black;}
.admin{background:orange;}
.user{background:gray;}
</style>
</head>

<body>

<div class="top">🔥 CRIMSON DEVIL WORLD - LIVE CHAT</div>

<div id="chat"></div>

<div class="input">
  <input id="text" placeholder="Type message...">
  <button onclick="sendMsg()">Send</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AlzaSyBKpXQ9MWJ-6a1NSnKlhrLdxXfu8i6BYKE",
  authDomain: "crimson-devil-world.firebaseapp.com",
  projectId: "crimson-devil-world",
  storageBucket: "crimson-devil-world.appspot.com",
  messagingSenderId: "625125480692",
  appId: "1:625125480692:web:fcf6202469371862c66a1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* 👤 USER SYSTEM */
let currentUser = {
  name: "Santosh",
  role: "owner"   // change: user / admin / owner
};

/* 💬 SEND MESSAGE */
function sendMsg(){
  let text = document.getElementById("text").value;
  if(text.trim()=="") return;

  db.ref("messages").push({
    name: currentUser.name,
    role: currentUser.role,
    text: text,
    time: Date.now()
  });

  document.getElementById("text").value="";
}

/* 🔥 LIVE CHAT */
db.ref("messages").on("value", snap=>{
  let chat = document.getElementById("chat");
  chat.innerHTML="";

  snap.forEach(child=>{
    let d = child.val();

    let badge="";
    if(d.role==="owner") badge="👑 OWNER";
    else if(d.role==="admin") badge="⚙ ADMIN";
    else badge="USER";

    let div = document.createElement("div");
    div.className="msg";

    div.innerHTML=`
      <b>${d.name}</b> <span class="badge">${badge}</span><br>
      ${d.text}
    `;

    chat.appendChild(div);
  });

  chat.scrollTop = chat.scrollHeight;
});
</script>

</body>
</html>
