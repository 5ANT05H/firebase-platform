<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CRIMSON DEVIL WORLD FULL</title>

<style>
body{
margin:0;
background:black;
color:white;
font-family:Arial;
text-align:center;
}

#auth{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

button{
padding:12px;
margin:10px;
width:220px;
background:red;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
}

.card{
background:#111;
margin:15px;
padding:20px;
border:1px solid red;
display:inline-block;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
<h1>💀 DEVIL WORLD LOGIN</h1>
<button onclick="login()">LOGIN WITH GOOGLE</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<h2 id="userInfo"></h2>

<div class="card">
<h3>🔥 LIVE POST</h3>

<button onclick="vote('like')">👍 LIKE</button>
<button onclick="vote('dislike')">👎 DISLIKE</button>

<p id="votes">Loading...</p>

</div>

</div>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc,
increment
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
apiKey: "AIzaSyAwyFcuUfpvu4DcXRMF-7VNPr6v39MniRU",
authDomain: "crimson-platform-92f67.firebaseapp.com",
projectId: "crimson-platform-92f67"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

/* HEAD OWNER */
const OWNER_EMAIL = "tksantosh0@gmail.com";

let currentUser = null;

/* LOGIN */
window.login = async function(){

try{

const result = await signInWithPopup(auth, provider);
const user = result.user;

currentUser = user;

/* ROLE */
let role = "USER";
if(user.email === OWNER_EMAIL){
role = "HEAD OWNER 👑";
}

/* UI */
document.getElementById("auth").style.display="none";
document.getElementById("app").style.display="block";

document.getElementById("userInfo").innerText =
"👤 " + user.displayName + " | " + role;

/* INIT POST */
initPost();

}catch(e){
console.log(e);
alert("Login Failed");
}

};

/* CREATE POST IF NOT EXISTS */
async function initPost(){

const ref = doc(db,"posts","main");

const snap = await getDoc(ref);

if(!snap.exists()){
await setDoc(ref,{
likes:0,
dislikes:0
});
}

loadVotes();

}

/* LOAD VOTES */
async function loadVotes(){

const ref = doc(db,"posts","main");
const snap = await getDoc(ref);

let data = snap.data();

document.getElementById("votes").innerText =
"👍 Likes: " + data.likes + " | 👎 Dislikes: " + data.dislikes;

}

/* VOTE SYSTEM */
window.vote = async function(type){

const ref = doc(db,"posts","main");

if(type === "like"){
await updateDoc(ref,{
likes: increment(1)
});
}else{
await updateDoc(ref,{
dislikes: increment(1)
});
}

loadVotes();

};

</script>

</body>
</html>
