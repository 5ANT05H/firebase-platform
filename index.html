<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getAuth, 
  GoogleAuthProvider, 
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAZHtBlagfvIDUOSkI_zi7WEKJFk6S_fCA",
  authDomain: "crimsonseling.firebaseapp.com",
  projectId: "crimsonseling",
  storageBucket: "crimsonseling.firebasestorage.app",
  appId: "1:937988013541:web:7ad4f06203d596e641430c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const OWNER_EMAIL = "tksantosh0@gmail.com";

/* LOGIN */
window.login = async function(){

  const provider = new GoogleAuthProvider();

  try {
    const result = await signInWithPopup(auth, provider);
    showUser(result.user);
  } catch (e) {
    alert("Login Error: " + e.message);
  }
};

/* LOGOUT */
window.logout = function(){
  signOut(auth);
  location.reload();
};

/* AUTO CHECK LOGIN */
onAuthStateChanged(auth, (user) => {
  if(user){
    showUser(user);
  }
});

/* DASHBOARD */
function showUser(user){

  let role = "user";
  if(user.email === OWNER_EMAIL){
    role = "head_owner";
  }

  document.body.innerHTML = `
    <h1>🔥 DASHBOARD</h1>

    <h2>👤 ${user.email}</h2>
    <h3>Role: ${role}</h3>

    <button onclick="logout()">Logout</button>
  `;
}

</script>
