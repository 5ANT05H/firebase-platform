<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CYBER DEVIL WORLD</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050505;
color:white;
}

/* TOP BAR */
#topBar{
background:#111;
border-bottom:2px solid red;
padding:6px;
}

/* AUTH */
#auth{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#111;
padding:20px;
width:320px;
border:1px solid red;
text-align:center;
box-shadow:0 0 15px red;
}

input,button{
padding:10px;
margin:5px;
width:90%;
}

button{
background:red;
color:white;
border:none;
cursor:pointer;
}

/* APP */
#app{
display:none;
}

/* SIDEBAR */
#sidebar{
width:70px;
height:100vh;
background:#111;
position:fixed;
left:0;
top:0;
border-right:1px solid red;
display:flex;
flex-direction:column;
align-items:center;
padding-top:10px;
}

#sidebar button{
width:45px;
height:45px;
margin:5px;
background:black;
color:red;
border:1px solid red;
cursor:pointer;
}

/* MAIN */
#main{
margin-left:80px;
padding:10px;
}

/* CHAT */
.chatBox{
height:250px;
overflow:auto;
border:1px solid red;
padding:10px;
background:#111;
}

/* PROFILE */
#profile{
display:none;
position:fixed;
right:0;
top:0;
width:300px;
height:100%;
background:#111;
border-left:1px solid red;
padding:10px;
}

#avatarGrid img{
width:60px;
height:60px;
margin:5px;
border-radius:50%;
border:2px solid red;
cursor:pointer;
transition:0.3s;
}

#avatarGrid img:hover{
transform:scale(1.2);
box-shadow:0 0 15px red;
}
</style>

</head>

<body>

<!-- TOP NEWS -->
<div id="topBar">
<marquee id="newsBar" scrollamount="6">
💀 CYBER DEVIL WORLD ACTIVE
</marquee>
</div>

<!-- AUTH SYSTEM -->
<div id="auth">

<!-- REGISTER -->
<div id="registerBox" class="box">

<h2>REGISTER</h2>

<input id="r_user" placeholder="username">
<input id="r_pass" placeholder="password">
<input id="r_cpass" placeholder="confirm password">
<input id="r_email" placeholder="gmail">

<button onclick="register()">REGISTER</button>

<p onclick="showLogin()" style="color:red;cursor:pointer;">
Already have account? LOGIN
</p>

</div>

<!-- LOGIN -->
<div id="loginBox" class="box" style="display:none;">

<h2>LOGIN</h2>

<input id="l_user" placeholder="username">
<input id="l_pass" type="password" placeholder="password">

<button onclick="login()">LOGIN</button>

<p onclick="showRegister()" style="color:red;cursor:pointer;">
Create new account? REGISTER
</p>

</div>

</div>

<!-- APP -->
<div id="app">

<div id="sidebar">
<button onclick="openChat('public')">P</button>
<button onclick="openChat('help')">H</button>
<button onclick="openChat('admin')">A</button>
<button onclick="openChat('owner')">O</button>
<button onclick="openChat('head')">👑</button>
<button onclick="openStore()">🛒</button>
<button onclick="openProfile()">👤</button>
</div>

<div id="main">
<h3 id="userInfo"></h3>
<div id="chatArea"></div>
</div>

</div>

<!-- PROFILE -->
<div id="profile">
<h3>PROFILE</h3>
<img id="avatar" width="60" height="60">
<div id="avatarGrid"></div>
</div>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
getFirestore,doc,getDoc,setDoc,collection,addDoc,query,orderBy,onSnapshot
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAwyFcuUfpvu4DcXRMF-7VNPr6v39MniRU",
projectId:"crimson-platform-92f67"
});

const db=getFirestore(app);

let currentUser=null;

/* AVATARS */
const avatars=[
"https://i.imgur.com/1.png",
"https://i.imgur.com/2.png",
"https://i.imgur.com/3.png",
"https://i.imgur.com/4.png",
"https://i.imgur.com/5.png",
"https://i.imgur.com/devil.gif"
];

/* SWITCH */
window.showLogin=function(){
registerBox.style.display="none";
loginBox.style.display="block";
};

window.showRegister=function(){
loginBox.style.display="none";
registerBox.style.display="block";
};

/* REGISTER */
window.register = async function(){

  if(!r_user.value || !r_pass.value){
    alert("Fill all fields");
    return;
  }

  if(r_pass.value !== r_cpass.value){
    alert("Password not match");
    return;
  }

  try{

    await setDoc(doc(db,"users",r_user.value),{
      username:r_user.value,
      password:r_pass.value,
      email:r_email.value,
      role:"USER",
      avatar:"https://i.imgur.com/0y0y0y0.png"
    });

    alert("REGISTER COMPLETE ✔");

    // 🔥 AUTO SWITCH TO LOGIN
    registerBox.style.display = "none";
    loginBox.style.display = "block";

    // clear inputs
    r_user.value="";
    r_pass.value="";
    r_cpass.value="";
    r_email.value="";

  }catch(err){
    console.log(err);
    alert("REGISTER FAILED");
  }

};

/* LOGIN */
window.login=async function(){

let snap=await getDoc(doc(db,"users",l_user.value));

if(!snap.exists()){
alert("User not found");
return;
}

let d=snap.data();

if(d.password!==l_pass.value){
alert("Wrong password");
return;
}

currentUser=d;

startApp();
};

/* START */
function startApp(){

auth.style.display="none";
app.style.display="block";

userInfo.innerText=`👤 ${currentUser.username} | ${currentUser.role}`;

loadAvatars();
openChat('public');
}

/* CHAT */
window.openChat=function(type){

chatArea.innerHTML=`
<h3>${type.toUpperCase()}</h3>
<input id="msg">
<button onclick="send('${type}')">SEND</button>
<div class="chatBox" id="box"></div>
`;

loadChat(type);
};

window.send=async function(type){

await addDoc(collection(db,type),{
text:msg.value,
user:currentUser.username,
time:Date.now()
});

msg.value="";
};

function loadChat(type){

const q=query(collection(db,type),orderBy("time"));

onSnapshot(q,snap=>{

let h="";

snap.forEach(d=>{
h+=`<p><b>${d.data().user}</b>: ${d.data().text}</p>`;
});

box.innerHTML=h;

});

}

/* STORE */
window.openStore=function(){

chatArea.innerHTML=`
<div style="border:1px solid red;padding:10px">
GTA V 2.2 - $29.99<br>
PUBG MOD - $9.99<br>
FREE FIRE - $14.99
</div>
`;

}

/* PROFILE */
window.openProfile=function(){

profile.style.display="block";

let grid=document.getElementById("avatarGrid");
grid.innerHTML="";

avatars.forEach(a=>{

let i=document.createElement("img");
i.src=a;

i.onclick=async()=>{

avatar.src=a;

await setDoc(doc(db,"users",currentUser.username),{
avatar:a
},{merge:true});

};

grid.appendChild(i);

});

}

</script>

</body>
</html>
