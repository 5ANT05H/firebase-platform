<!DOCTYPE html>
<html>
<head>
  <title>CRIMSON CHAT SYSTEM</title>
</head>

<body style="margin:0;background:#0a0a0a;color:white;font-family:Arial;">

<div id="app">Loading...</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAwyFcuUfpvu4DcXRMF-7VNPr6v39MniRU",
  authDomain: "crimson-platform-92f67.firebaseapp.com",
  projectId: "crimson-platform-92f67",
  storageBucket: "crimson-platform-92f67.firebasestorage.app",
  appId: "1:7775873440:web:b81205d0d1e84e12f3dcc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const appDiv = document.getElementById("app");

/* LOGIN */
function loginUI(){
  appDiv.innerHTML = `
    <h1>🔥 LOGIN</h1>
    <button id="loginBtn">Login with Google</button>
  `;

  document.getElementById("loginBtn").onclick = async () => {
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
  };
}

/* DASHBOARD */
function dashboard(user){

  appDiv.innerHTML = `
    <h2>👤 ${user.email}</h2>
    <button onclick="logout()">Logout</button>

    <hr>

    <h2>💬 LIVE CHAT</h2>

    <input id="msg" placeholder="type message">
    <button onclick="sendMsg()">Send</button>

    <div id="chatBox"></div>
  `;

  loadChat();
}

/* SEND MESSAGE */
window.sendMsg = async function(){

  let msg = document.getElementById("msg").value;
  if(!msg) return;

  await addDoc(collection(db,"chat"),{
    text:msg,
    email:auth.currentUser.email,
    time:Date.now()
  });

  document.getElementById("msg").value = "";
};

/* LOAD CHAT (REAL TIME) */
function loadChat(){

  const q = query(collection(db,"chat"),orderBy("time"));

  onSnapshot(q,(snap)=>{

    let html = "";

    snap.forEach(doc=>{
      let d = doc.data();
      html += `<p><b>${d.email}:</b> ${d.text}</p>`;
    });

    document.getElementById("chatBox").innerHTML = html;

  });

}

/* LOGOUT */
window.logout = function(){
  signOut(auth);
};

/* AUTH STATE */
onAuthStateChanged(auth, (user)=>{

  if(user){
    dashboard(user);
  } else {
    loginUI();
  }

});

</script>

</body>
</html>
