<!DOCTYPE html>
<html>
<head>
  <title>CRIMSON DEVIL WORLD</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0a0a0a;
      color:white;
    }

    /* INTRO */
    #intro{
      position:fixed;
      width:100%;
      height:100%;
      background:radial-gradient(circle,#2a0000,#000);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      z-index:10;
    }

    #intro h1{
      color:red;
      text-shadow:0 0 20px red;
    }

    /* AUTH SCREEN */
    #auth{
      display:none;
      height:100vh;
      justify-content:center;
      align-items:center;
    }

    .box{
      background:#111;
      padding:20px;
      border:1px solid red;
      width:280px;
      text-align:center;
    }

    input,button{
      padding:10px;
      margin:5px;
      width:90%;
    }

    button{
      background:red;
      color:white;
      border:none;
      cursor:pointer;
    }

    /* APP */
    #app{
      display:none;
      display:flex;
    }

    /* SIDEBAR */
    #sidebar{
      width:70px;
      background:#111;
      height:100vh;
      border-right:1px solid red;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding-top:10px;
    }

    #sidebar button{
      width:45px;
      height:45px;
      margin:8px;
      background:black;
      color:red;
      border:1px solid red;
    }

    /* MAIN */
    #main{
      flex:1;
      padding:10px;
    }

    .chatBox{
      height:250px;
      overflow:auto;
      border:1px solid red;
      padding:10px;
      background:#111;
    }

    /* PROFILE */
    #profile{
      display:none;
      position:fixed;
      right:0;
      top:0;
      width:250px;
      height:100%;
      background:#111;
      border-left:1px solid red;
      padding:10px;
    }

    img{
      width:80px;
      height:80px;
      border-radius:50%;
      border:2px solid red;
    }
  </style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <h1>🔥 CRIMSON DEVIL WORLD 🔥</h1>
  <p>Welcome to Dark System</p>
</div>

<!-- AUTH -->
<div id="auth">

  <div class="box">

    <h2>SIGNUP</h2>

    <input id="su_user" placeholder="username">
    <input id="su_pass" placeholder="password">

    <button onclick="signup()">SIGNUP</button>

    <hr>

    <h2>LOGIN</h2>

    <input id="li_user" placeholder="username">
    <input id="li_pass" placeholder="password">

    <button onclick="login()">LOGIN</button>

  </div>

</div>

<!-- APP -->
<div id="app">

  <div id="sidebar">
    <button onclick="openChat('public')">P</button>
    <button onclick="openChat('help')">H</button>
    <button onclick="openChat('admin')">A</button>
    <button onclick="openChat('owner')">O</button>
    <button onclick="openChat('head')">👑</button>
    <button onclick="toggleProfile()">👤</button>
  </div>

  <div id="main">
    <h3 id="userInfo"></h3>
    <div id="chatArea"></div>
  </div>

</div>

<!-- PROFILE -->
<div id="profile">
  <h3>PROFILE</h3>

  <img id="avatar" src="https://i.imgur.com/0y0y0y0.png">

  <input id="nameEdit" placeholder="name">
  <input id="avatarEdit" placeholder="avatar url">

  <button onclick="saveProfile()">SAVE</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAwyFcuUfpvu4DcXRMF-7VNPr6v39MniRU",
  authDomain: "crimson-platform-92f67.firebaseapp.com",
  projectId: "crimson-platform-92f67",
  storageBucket: "crimson-platform-92f67.firebasestorage.app",
  appId: "1:7775873440:web:b81205d0d1e84e12f3dcc5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = null;

const HEAD_OWNER = "C4CRIMSON";
const HEAD_PASS = "55479535@Sk";

/* INTRO FLOW */
setTimeout(()=>{
  document.getElementById("intro").style.display="none";
  document.getElementById("auth").style.display="flex";
},2500);

/* SIGNUP */
window.signup = async function(){

  let u = su_user.value;
  let p = su_pass.value;

  if(!u || !p) return alert("Fill fields");

  let ref = doc(db,"users",u);
  let snap = await getDoc(ref);

  if(snap.exists()) return alert("User exists");

  await setDoc(ref,{
    username:u,
    password:p,
    role:"USER",
    premium:false,
    avatar:"https://i.imgur.com/0y0y0y0.png"
  });

  alert("Signup success ✔");
};

/* LOGIN */
window.login = async function(){

  let u = li_user.value;
  let p = li_pass.value;

  // HEAD OWNER LOGIN
  if(u === HEAD_OWNER && p === HEAD_PASS){
    currentUser = {
      username:u,
      role:"HEAD OWNER",
      premium:true
    };
    enterApp();
    return;
  }

  let ref = doc(db,"users",u);
  let snap = await getDoc(ref);

  if(!snap.exists()) return alert("User not found");

  let data = snap.data();

  if(data.password !== p) return alert("Wrong password");

  currentUser = data;

  enterApp();
};

/* ENTER APP */
function enterApp(){

  document.getElementById("auth").style.display="none";
  document.getElementById("app").style.display="flex";

  document.getElementById("userInfo").innerText =
    `👤 ${currentUser.username} | ${currentUser.role}`;

  openChat("public");
}

/* PROFILE */
window.toggleProfile = function(){
  let p = document.getElementById("profile");
  p.style.display = p.style.display === "block" ? "none" : "block";
};

window.saveProfile = async function(){

  await setDoc(doc(db,"users",currentUser.username),{
    username: nameEdit.value,
    avatar: avatarEdit.value
  },{merge:true});

  alert("Profile updated ✔");
};

/* PERMISSION */
function check(type){

  if(type === "head"){
    if(currentUser.username !== HEAD_OWNER){
      alert("HEAD LOCK 🔒");
      return false;
    }
  }

  if(type === "owner"){
    if(!(currentUser.role === "OWNER" || currentUser.role === "ADMIN" || currentUser.username === HEAD_OWNER)){
      alert("OWNER LOCK 🔒");
      return false;
    }
  }

  return true;
}

/* CHAT */
window.openChat = function(type){

  if(!check(type)) return;

  document.getElementById("chatArea").innerHTML = `
    <h3>${type.toUpperCase()} CHAT</h3>

    <input id="msg">
    <button onclick="send('${type}')">SEND</button>

    <div class="chatBox" id="box"></div>
  `;

  load(type);
};

window.send = async function(type){

  let m = msg.value;
  if(!m) return;

  await addDoc(collection(db,type),{
    text:m,
    user:currentUser.username,
    role:currentUser.role,
    time:Date.now()
  });

  msg.value="";
};

function load(type){

  const q = query(collection(db,type),orderBy("time"));

  onSnapshot(q,(snap)=>{

    let html="";

    snap.forEach(d=>{
      let x = d.data();

      html += `
        <p>
          <b>${x.user}</b>
          (${x.role}): ${x.text}
        </p>
      `;
    });

    document.getElementById("box").innerHTML = html;

  });
}

</script>

</body>
</html>
