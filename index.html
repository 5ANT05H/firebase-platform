<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CRIMSON DEVIL WORLD</title>

<style>
body{
margin:0;
background:black;
color:white;
font-family:Arial;
text-align:center;
}

#auth{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

button{
padding:12px;
margin:10px;
width:220px;
background:red;
color:white;
border:none;
cursor:pointer;
}

.card{
background:#111;
margin:10px;
padding:15px;
border:1px solid red;
display:inline-block;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
<h1>💀 DEVIL WORLD LOGIN</h1>
<button onclick="login()">LOGIN WITH GOOGLE</button>
</div>

<!-- DASHBOARD -->
<div id="app" style="display:none">

<h2 id="userInfo"></h2>

<div class="card">
<h3>🔥 POST SYSTEM</h3>
<p>Devil System Active</p>

<button onclick="voteUp()">👍 LIKE</button>
<button onclick="voteDown()">👎 DISLIKE</button>

<p id="votes">Likes: 0 | Dislikes: 0</p>
</div>

</div>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
getAuth,
GoogleAuthProvider,
signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

/* YOUR FIREBASE CONFIG */
const firebaseConfig = {
apiKey: "AIzaSyAwyFcuUfpvu4DcXRMF-7VNPr6v39MniRU",
authDomain: "crimson-platform-92f67.firebaseapp.com",
projectId: "crimson-platform-92f67"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

/* HEAD OWNER */
const OWNER_EMAIL = "tksantosh0@gmail.com";

/* LOGIN */
window.login = async function(){

try{

const result = await signInWithPopup(auth, provider);
const user = result.user;

let role = "USER";

if(user.email === OWNER_EMAIL){
role = "HEAD OWNER 👑";
}

document.getElementById("auth").style.display="none";
document.getElementById("app").style.display="block";

document.getElementById("userInfo").innerText =
"👤 " + user.displayName + " | " + role;

}catch(e){
console.log(e);
alert("Login Failed");
}

};

/* VOTE SYSTEM (LOCAL DEMO) */
let likes = 0;
let dislikes = 0;

window.voteUp = function(){
likes++;
updateVotes();
};

window.voteDown = function(){
dislikes++;
updateVotes();
};

function updateVotes(){
document.getElementById("votes").innerText =
"Likes: " + likes + " | Dislikes: " + dislikes;
}

</script>

</body>
</html>
