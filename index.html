<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crimson Devil World - Premium Interface</title>
    <style>
        /* CSS VARIABLES FOR GAMING THEME */
        :root {
            --primary: #dc143c; /* Crimson Red */
            --primary-hover: #ff2a55;
            --bg-dark: #0f0f11;
            --panel-bg: #1a1a1d;
            --text-main: #f0f0f0;
            --text-muted: #888;
            --border-color: #333;
            --message-self: #dc143c;
            --message-other: #2a2a2d;
        }

        /* RESET & BASIC SETUP */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; background-image: radial-gradient(circle at 50% 0%, #2a0810 0%, #0f0f11 60%); }
        
        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        
        /* MAIN CONTAINER */
        .container { width: 100%; max-width: 900px; background: var(--panel-bg); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(220, 20, 60, 0.2); border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column; min-height: 85vh; animation: fadeIn 0.5s ease-out; margin: 20px; }
        
        /* HEADERS */
        .app-header { background: linear-gradient(90deg, #1a1a1d, #4a0414); padding: 20px; text-align: center; border-bottom: 2px solid var(--primary); position: relative; }
        .app-header h2 { text-transform: uppercase; letter-spacing: 2px; color: #fff; text-shadow: 0 0 10px var(--primary); font-size: 24px; }
        .user-badge { position: absolute; right: 20px; top: 20px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; font-size: 12px; color: var(--primary); border: 1px solid var(--primary); }

        /* BUTTONS & INPUTS */
        input, select, button { padding: 12px 15px; margin: 10px 0; border-radius: 6px; border: none; width: 100%; outline: none; transition: all 0.3s; font-size: 14px; }
        input, select { background: #222; color: #fff; border: 1px solid var(--border-color); }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(220, 20, 60, 0.3); }
        button { background-color: var(--primary); color: white; cursor: pointer; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background-color: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(220, 20, 60, 0.4); }
        button:active { transform: translateY(0); }
        
        /* AUTH SECTIONS */
        .auth-wrapper { padding: 40px; max-width: 450px; margin: auto; width: 100%; }
        .auth-toggle { text-align: center; margin-top: 20px; color: var(--text-muted); cursor: pointer; font-size: 14px; transition: 0.3s; }
        .auth-toggle:hover { color: var(--primary); text-decoration: underline; }
        
        /* DASHBOARD NAV */
        .nav-bar { display: flex; background: #111; border-bottom: 1px solid var(--border-color); }
        .nav-bar button { margin: 0; border-radius: 0; background: transparent; color: var(--text-muted); flex: 1; padding: 15px; font-size: 13px; box-shadow: none; border-bottom: 3px solid transparent; }
        .nav-bar button:hover { background: #222; transform: none; box-shadow: none; }
        .nav-bar button.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: #1a1a1d; }
        
        /* CONTENT PANELS */
        .panel { padding: 20px; display: flex; flex-direction: column; flex: 1; animation: slideUp 0.4s ease-out; }
        .hidden { display: none !important; }
        
        /* CHAT INTERFACE */
        .chat-container { display: flex; flex-direction: column; height: 50vh; border: 1px solid var(--border-color); background: #0a0a0c; border-radius: 8px; margin-top: 10px; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        
        /* MESSAGE BUBBLES */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
        .msg-wrapper.self { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.other { align-self: flex-start; align-items: flex-start; }
        
        .msg-sender { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; font-weight: bold; }
        .msg-wrapper.self .msg-sender { color: var(--primary); }
        
        .msg-bubble { padding: 10px 14px; border-radius: 15px; font-size: 14px; line-height: 1.4; word-wrap: break-word; position: relative; }
        .msg-wrapper.self .msg-bubble { background: var(--primary); color: white; border-bottom-right-radius: 2px; box-shadow: 0 2px 10px rgba(220, 20, 60, 0.2); }
        .msg-wrapper.other .msg-bubble { background: var(--message-other); border: 1px solid var(--border-color); border-bottom-left-radius: 2px; }
        
        .msg-time { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 4px; text-align: right; }
        
        /* CHAT INPUT AREA */
        .chat-input-area { padding: 10px; background: #1a1a1d; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
        .controls-row { display: flex; gap: 10px; }
        .controls-row button { margin: 0; font-size: 12px; padding: 10px; background: #333; color: #fff; box-shadow: none; }
        .controls-row button:hover { background: #444; }
        #btn-file { background: #2e8b57; }
        #btn-file:hover { background: #3cb371; }
        #btn-send { background: var(--primary); }
        
        /* LEADERBOARD TABLE */
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 15px; }
        th, td { padding: 15px 10px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: #111; color: var(--primary); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        tr:hover td { background-color: rgba(255,255,255,0.05); }
        .rank-1 { color: #ffd700; font-weight: bold; text-shadow: 0 0 5px #ffd700; }
        .rank-2 { color: #c0c0c0; font-weight: bold; }
        .rank-3 { color: #cd7f32; font-weight: bold; }

        /* TOAST NOTIFICATIONS */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 12px 20px; border-radius: 6px; color: white; font-size: 14px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.5); animation: slideInRight 0.3s forwards; opacity: 0; transform: translateX(100%); }
        .toast.success { background-color: #2ecc71; border-left: 5px solid #27ae60; }
        .toast.error { background-color: #e74c3c; border-left: 5px solid #c0392b; }
        .toast.info { background-color: #3498db; border-left: 5px solid #2980b9; }

        /* ANIMATIONS */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInRight { to { opacity: 1; transform: translateX(0); } }
        
        /* RESPONSIVE */
        @media (max-width: 600px) {
            .container { margin: 0; border-radius: 0; min-height: 100vh; border: none; }
            .nav-bar button { font-size: 11px; padding: 10px 5px; }
            .auth-wrapper { padding: 20px; }
        }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div class="container">
    <div class="app-header">
        <h2 id="app-title">Crimson Devil World</h2>
        <div id="header-badge" class="user-badge hidden"></div>
    </div>

    <div id="auth-section" class="auth-wrapper">
        
        <div id="login-box">
            <h3 style="margin-bottom: 20px; text-align: center;">SYSTEM LOGIN</h3>
            <input type="text" id="login-username" placeholder="Username" autocomplete="off">
            <input type="password" id="login-password" placeholder="Password">
            <button id="btn-login" style="margin-top: 20px;">Deploy</button>
            <div class="auth-toggle" id="go-to-register">New Recruit? Register Here</div>
        </div>

        <div id="register-box" class="hidden">
            <h3 style="margin-bottom: 20px; text-align: center;">CREATE ACCOUNT</h3>
            <input type="text" id="reg-username" placeholder="Unique Username" autocomplete="off">
            <input type="password" id="reg-password" placeholder="Strong Password">
            <select id="reg-role">
                <option value="user">Standard User</option>
                <option value="premium_user">Premium Elite</option>
                <option value="admin">Admin / Moderator</option>
                <option value="owner">Owner</option>
                <option value="head_owner">Head Owner</option>
            </select>
            <button id="btn-register" style="margin-top: 20px;">Initialize Profile</button>
            <div class="auth-toggle" id="go-to-login">Already have clearance? Login</div>
        </div>
    </div>

    <div id="dashboard-section" class="hidden">
        <div class="nav-bar">
            <button id="tab-chat" class="active">COMMUNICATIONS</button>
            <button id="tab-leaderboard">LEADERBOARD</button>
            <button id="tab-settings">SYSTEM SETTINGS</button>
            <button id="btn-logout" style="color: #e74c3c;">LOGOUT</button>
        </div>

        <div id="chat-tab" class="panel">
            <label style="font-size: 12px; color: var(--text-muted); margin-bottom: 5px;">SELECT SECURE CHANNEL:</label>
            <select id="chat-room-select" style="margin-top: 0;">
                <option value="public_chat">Public Lobby</option>
                <option value="premium_chat">Premium Lounge</option>
                <option value="admin_chat">Admin Command Center</option>
                <option value="owner_chat">Owner Boardroom</option>
                <option value="head_owner_chat">Head Owner Sanctum</option>
            </select>
            
            <div id="access-denied-msg" class="hidden" style="color: var(--primary); text-align: center; margin-top: 50px; font-size: 18px; font-weight: bold;">
                [ ACCESS DENIED - INSUFFICIENT CLEARANCE ]
            </div>
            
            <div id="chat-interface" class="chat-container hidden">
                <div class="chat-messages" id="chat-messages">
                    </div>
                
                <div class="chat-input-area">
                    <div class="controls-row" id="media-controls">
                        <button id="btn-emoji" style="flex: 1;">😀 Emoji</button>
                        <button id="btn-photo" style="flex: 1;">📷 Photo</button>
                        <button id="btn-file" style="flex: 1; display: none;">📁 Secure Upload</button>
                    </div>
                    <div class="controls-row">
                        <input type="text" id="chat-input" placeholder="Transmit message..." style="flex: 4; margin: 0;">
                        <button id="btn-send" style="flex: 1; margin: 0;">SEND</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="leaderboard-tab" class="panel hidden">
            <h3 style="color: var(--primary); border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">TOP 100 ELITE PLAYERS</h3>
            <div style="overflow-y: auto; flex: 1;">
                <table>
                    <thead>
                        <tr>
                            <th width="15%">RANK</th>
                            <th width="50%">PLAYER IGN</th>
                            <th width="35%">CRIMSON POINTS</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        </tbody>
                </table>
            </div>
        </div>

        <div id="settings-tab" class="panel hidden">
            <h3 style="color: var(--primary); margin-bottom: 20px;">PROFILE MANAGEMENT</h3>
            <div style="background: #111; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color);">
                <label style="font-size: 12px; color: var(--text-muted);">CURRENT CLEARANCE LEVEL:</label>
                <input type="text" id="display-role" disabled style="background: #0a0a0c; cursor: not-allowed; text-transform: uppercase; color: var(--primary);">
                
                <label style="font-size: 12px; color: var(--text-muted); margin-top: 15px; display: block;">UPDATE CALLSIGN (USERNAME):</label>
                <input type="text" id="new-username" placeholder="Enter new username">
                <button id="btn-save-settings" style="margin-top: 15px;">UPDATE PROFILE</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getDatabase, ref, set, update, get, orderByChild, equalTo, query, limitToLast, onValue, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    // FIREBASE CONFIGURATION
    const firebaseConfig = {
        apiKey: "AIzaSyBKpXQ9MWJ-6a1NSnKlhrLdxXfu8i6BYkE",
        authDomain: "crimson-devil-world.firebaseapp.com",
        databaseURL: "https://crimson-devil-world-default-rtdb.firebaseio.com",
        projectId: "crimson-devil-world",
        storageBucket: "crimson-devil-world.firebasestorage.app",
        messagingSenderId: "625125480692",
        appId: "1:625125480692:web:cf7dc8b4a8d7cac82c66a1"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // SYSTEM STATE
    let currentUser = null;
    let currentUserKey = null;
    let currentChatRoom = null;
    let chatListenerUnsubscribe = null;

    const roles = {
        HEAD_OWNER: 'head_owner',
        OWNER: 'owner',
        ADMIN: 'admin',
        PREMIUM: 'premium_user',
        USER: 'user'
    };

    // UTILITY: TOAST NOTIFICATIONS
    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerText = message;
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.style.animation = 'slideInRight 0.3s forwards reverse';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // UTILITY: FORMAT TIMESTAMP
    function formatTime(timestamp) {
        if (!timestamp) return '';
        const date = new Date(timestamp);
        let hours = date.getHours();
        const minutes = date.getMinutes().toString().padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12; 
        return `${hours}:${minutes} ${ampm}`;
    }

    // DOM ELEMENTS
    const ui = {
        loginBtn: document.getElementById('btn-login'),
        regBtn: document.getElementById('btn-register'),
        logoutBtn: document.getElementById('btn-logout'),
        sendBtn: document.getElementById('btn-send'),
        saveBtn: document.getElementById('btn-save-settings'),
        roomSelect: document.getElementById('chat-room-select'),
        chatInput: document.getElementById('chat-input'),
        chatBox: document.getElementById('chat-messages'),
        headerBadge: document.getElementById('header-badge')
    };

    // EVENT LISTENERS
    document.getElementById('go-to-register').addEventListener('click', () => toggleAuth('register'));
    document.getElementById('go-to-login').addEventListener('click', () => toggleAuth('login'));
    
    document.getElementById('tab-chat').addEventListener('click', (e) => switchTab('chat-tab', e.target));
    document.getElementById('tab-leaderboard').addEventListener('click', (e) => switchTab('leaderboard-tab', e.target));
    document.getElementById('tab-settings').addEventListener('click', (e) => switchTab('settings-tab', e.target));

    ui.loginBtn.addEventListener('click', loginUser);
    ui.regBtn.addEventListener('click', registerUser);
    ui.logoutBtn.addEventListener('click', logoutUser);
    ui.saveBtn.addEventListener('click', updateProfile);
    ui.roomSelect.addEventListener('change', loadChatRoom);
    
    // Enter key to send message
    ui.chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // 1. AUTHENTICATION LOGIC
    function toggleAuth(type) {
        if(type === 'register') {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('register-box').classList.remove('hidden');
        } else {
            document.getElementById('register-box').classList.add('hidden');
            document.getElementById('login-box').classList.remove('hidden');
        }
    }

    async function registerUser() {
        const userVal = document.getElementById('reg-username').value.trim();
        const passVal = document.getElementById('reg-password').value.trim();
        const roleVal = document.getElementById('reg-role').value;

        if (!userVal || !passVal) return showToast('Please fill all fields', 'error');

        try {
            ui.regBtn.innerText = "Processing...";
            const usersRef = ref(database, 'users');
            const checkQ = query(usersRef, orderByChild('username'), equalTo(userVal));
            const snap = await get(checkQ);

            if (snap.exists()) {
                showToast('Username already taken!', 'error');
                ui.regBtn.innerText = "Initialize Profile";
                return;
            }

            const newUserKey = 'user_' + Date.now();
            await set(ref(database, 'users/' + newUserKey), {
                username: userVal,
                password: passVal,
                role: roleVal,
                crimson_points: 0,
                created_at: serverTimestamp()
            });

            showToast('Account Created Successfully!', 'success');
            document.getElementById('reg-username').value = '';
            document.getElementById('reg-password').value = '';
            setTimeout(() => toggleAuth('login'), 1500);

        } catch (error) {
            showToast('Database Error during registration', 'error');
            console.error(error);
        } finally {
            ui.regBtn.innerText = "Initialize Profile";
        }
    }

    async function loginUser() {
        const userVal = document.getElementById('login-username').value.trim();
        const passVal = document.getElementById('login-password').value.trim();

        if (!userVal || !passVal) return showToast('Credentials required', 'error');

        try {
            ui.loginBtn.innerText = "Authenticating...";
            const usersRef = ref(database, 'users');
            const q = query(usersRef, orderByChild('username'), equalTo(userVal));
            const snap = await get(q);

            if (snap.exists()) {
                let found = false;
                snap.forEach((child) => {
                    const data = child.val();
                    if (data.password === passVal) {
                        currentUser = data;
                        currentUserKey = child.key;
                        found = true;
                        initDashboard();
                    }
                });
                if (!found) showToast('Invalid Password', 'error');
            } else {
                showToast('User not found in system', 'error');
            }
        } catch (error) {
            showToast('Connection failed', 'error');
            console.error(error);
        } finally {
            ui.loginBtn.innerText = "Deploy";
        }
    }

    function initDashboard() {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        ui.headerBadge.innerText = `[ ${currentUser.role.replace('_', ' ').toUpperCase()} ]`;
        ui.headerBadge.classList.remove('hidden');
        document.getElementById('display-role').value = currentUser.role.toUpperCase();
        
        showToast(`Welcome back, ${currentUser.username}`, 'success');
        
        loadChatRoom(); 
        startLeaderboardSync();
    }

    function logoutUser() {
        currentUser = null;
        currentUserKey = null;
        if(chatListenerUnsubscribe) chatListenerUnsubscribe(); // Stop listening to chat
        
        document.getElementById('dashboard-section').classList.add('hidden');
        document.getElementById('auth-section').classList.remove('hidden');
        ui.headerBadge.classList.add('hidden');
        document.getElementById('login-password').value = '';
        showToast('System logged out successfully', 'info');
    }

    // 2. DASHBOARD NAVIGATION
    function switchTab(tabId, btnTarget) {
        document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
        document.getElementById(tabId).classList.remove('hidden');
        
        document.querySelectorAll('.nav-bar button').forEach(b => b.classList.remove('active'));
        btnTarget.classList.add('active');
    }

    // 3. SECURE CHAT SYSTEM (REAL-TIME DB SYNC)
    function checkPermissions(room) {
        const r = currentUser.role || 'user';
        switch (room) {
            case 'head_owner_chat': return [roles.HEAD_OWNER, roles.OWNER].includes(r);
            case 'owner_chat': return [roles.HEAD_OWNER, roles.OWNER, roles.ADMIN].includes(r);
            case 'admin_chat': return true; // All allowed as per rules
            case 'premium_chat': return [roles.HEAD_OWNER, roles.OWNER, roles.ADMIN, roles.PREMIUM].includes(r);
            case 'public_chat': return true;
            default: return false;
        }
    }

    function loadChatRoom() {
        const room = ui.roomSelect.value;
        const interfaceDiv = document.getElementById('chat-interface');
        const deniedMsg = document.getElementById('access-denied-msg');
        
        if (checkPermissions(room)) {
            interfaceDiv.classList.remove('hidden');
            deniedMsg.classList.add('hidden');
            currentChatRoom = room;
            
            // Apply File Upload rules
            const fileBtn = document.getElementById('btn-file');
            if (['head_owner_chat', 'owner_chat', 'admin_chat'].includes(room)) {
                fileBtn.style.display = 'block';
            } else {
                fileBtn.style.display = 'none';
            }

            syncMessages(room);
        } else {
            interfaceDiv.classList.add('hidden');
            deniedMsg.classList.remove('hidden');
            if(chatListenerUnsubscribe) { chatListenerUnsubscribe(); chatListenerUnsubscribe = null; }
        }
    }

    function syncMessages(room) {
        ui.chatBox.innerHTML = `<div style="text-align:center; color:var(--primary); font-size:12px; margin-bottom:15px;">--- SECURE CONNECTION ESTABLISHED: ${room.toUpperCase()} ---</div>`;
        
        // Remove previous listener if exists to prevent duplicate messages
        if (chatListenerUnsubscribe) chatListenerUnsubscribe();

        const chatRef = ref(database, `chats/${room}`);
        const chatQuery = query(chatRef, limitToLast(50)); // Load last 50 messages
        
        chatListenerUnsubscribe = onChildAdded(chatQuery, (snapshot) => {
            const msgData = snapshot.val();
            renderMessage(msgData);
        });
    }

    function renderMessage(data) {
        const isSelf = data.senderKey === currentUserKey;
        const timeStr = formatTime(data.timestamp);
        
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${isSelf ? 'self' : 'other'}`;
        
        wrapper.innerHTML = `
            ${!isSelf ? `<div class="msg-sender">${data.senderName}</div>` : ''}
            <div class="msg-bubble">${data.text}
                <div class="msg-time">${timeStr}</div>
            </div>
        `;
        
        ui.chatBox.appendChild(wrapper);
        ui.chatBox.scrollTop = ui.chatBox.scrollHeight; // Auto scroll to bottom
    }

    async function sendMessage() {
        const text = ui.chatInput.value.trim();
        if (!text || !currentChatRoom) return;

        ui.chatInput.value = ''; // Clear input immediately for UX

        try {
            const chatRef = ref(database, `chats/${currentChatRoom}`);
            await push(chatRef, {
                senderKey: currentUserKey,
                senderName: currentUser.username,
                text: text,
                timestamp: serverTimestamp()
            });
        } catch (error) {
            showToast('Failed to transmit message', 'error');
            console.error(error);
        }
    }

    ui.sendBtn.addEventListener('click', sendMessage);

    // 4. LIVE LEADERBOARD ENGINE
    function startLeaderboardSync() {
        const usersRef = ref(database, 'users');
        const q = query(usersRef, orderByChild('crimson_points'), limitToLast(100));
        
        onValue(q, (snapshot) => {
            let dataList = [];
            snapshot.forEach((child) => { dataList.push(child.val()); });
            dataList.reverse(); // Highest points first
            
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            
            dataList.forEach((user, index) => {
                const rankNum = index + 1;
                let rankClass = '';
                if(rankNum === 1) rankClass = 'rank-1';
                else if(rankNum === 2) rankClass = 'rank-2';
                else if(rankNum === 3) rankClass = 'rank-3';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="${rankClass}">#${rankNum}</td>
                    <td style="font-weight:bold;">${user.username || 'Unknown'}</td>
                    <td style="color:var(--primary); font-family:monospace; font-size:16px;">${user.crimson_points || 0} PTS</td>
                `;
                tbody.appendChild(tr);
            });
        });
    }

    // 5. PROFILE SETTINGS
    async function updateProfile() {
        const newName = document.getElementById('new-username').value.trim();
        if (!newName) return showToast('Username cannot be empty', 'error');

        try {
            ui.saveBtn.innerText = "UPDATING...";
            
            // Check uniqueness
            const usersRef = ref(database, 'users');
            const q = query(usersRef, orderByChild('username'), equalTo(newName));
            const snap = await get(q);
            
            if (snap.exists()) {
                showToast('Callsign already in use by another operator', 'error');
                ui.saveBtn.innerText = "UPDATE PROFILE";
                return;
            }

            // Update user node
            await update(ref(database, 'users/' + currentUserKey), { username: newName });
            
            currentUser.username = newName;
            showToast('Profile Updated Successfully', 'success');
            document.getElementById('new-username').value = '';
            
        } catch (error) {
            showToast('Update failed. Connection error.', 'error');
        } finally {
            ui.saveBtn.innerText = "UPDATE PROFILE";
        }
    }

</script>
