<!DOCTYPE html>
<html>
<head>
  <title>LOGIN TEST</title>
</head>

<body style="font-family: Arial; text-align:center; background:#111; color:white;">

<h1>🔥 LOGIN TEST</h1>

<button onclick="login()">Login with Google</button>

<p id="status">Not logged in</p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { 
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAwyFcuUfpvu4DcXRMF-7VNPr6v39MniRU",
  authDomain: "crimson-platform-92f67.firebaseapp.com",
  projectId: "crimson-platform-92f67",
  storageBucket: "crimson-platform-92f67.firebasestorage.app",
  appId: "1:7775873440:web:b81205d0d1e84e12f3dcc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* LOGIN */
window.login = async function(){
  const provider = new GoogleAuthProvider();

  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    alert("ERROR: " + e.message);
  }
};

/* STATE */
onAuthStateChanged(auth, (user) => {
  const status = document.getElementById("status");

  if(user){
    status.innerText = "LOGIN SUCCESS ✔ " + user.email;
  } else {
    status.innerText = "Not logged in";
  }
});

</script>

</body>
</html>
