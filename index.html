<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crimson 404 | Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121212; color: #fff; }
        
        header { display: flex; justify-content: space-between; align-items: center; background-color: #800000; padding: 15px 20px; border-bottom: 2px solid #dc143c; }
        .menu-icon { cursor: pointer; display: flex; flex-direction: column; gap: 5px; z-index: 1000; }
        .menu-icon div { width: 30px; height: 3px; background-color: white; transition: 0.3s; }
        .menu-icon.active div:nth-child(1) { transform: rotate(-45deg) translate(-5px, 6px); }
        .menu-icon.active div:nth-child(2) { transform: rotate(45deg) translate(-5px, -6px); }

        .logo { font-size: 24px; font-weight: bold; }
        .profile { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; }

        .sidebar { position: fixed; left: -300px; top: 0; width: 250px; height: 100%; background-color: #1a1a1a; border-right: 2px solid #dc143c; padding-top: 80px; transition: 0.4s; z-index: 999; }
        .sidebar.active { left: 0; }
        .sidebar ul li { padding: 15px 20px; border-bottom: 1px solid #333; cursor: pointer; transition: 0.3s; }
        .sidebar ul li:hover { background: #dc143c; }

        .banner { background-color: #2a0000; padding: 10px; border-bottom: 1px solid #dc143c; font-weight: bold; }
        .main-content { padding: 20px; }
        .feedback-card { background: #1e1e1e; border: 1px solid #dc143c; border-radius: 8px; padding: 20px; margin-bottom: 15px; text-align: center; cursor: pointer; }
        
        #chat-container { display: none; padding: 20px; background: #1a1a1a; border-radius: 10px; }
        #messages { height: 250px; overflow-y: scroll; background: #000; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="menu-icon" id="menuToggle"><div></div><div></div></div>
        <div class="logo">Crimson 404</div>
        <div class="profile">Points: <strong>1000</strong> <img src="https://via.placeholder.com/40" class="avatar"></div>
    </header>

    <div class="banner">
        <marquee>📢 Head Owner Login Detected: C4CRIMSON | 🚀 Premium Members get 50 Points! | 🛡️ Secure Connection Active!</marquee>
    </div>

    <nav class="sidebar" id="sidebar">
        <ul>
            <li onclick="location.reload()">1. Home</li>
            <li onclick="openChat('Head Owner Chat')">2. Head Owner Chat</li>
            <li onclick="openChat('Owner Chat')">3. Owner Chat</li>
            <li>12. Settings</li>
        </ul>
    </nav>

    <div class="main-content" id="dashboard">
        <div class="feedback-card" onclick="openChat('Feedback')"><h3>All Feedback</h3></div>
        <div class="feedback-card" onclick="openChat('Proof')"><h3>Purchase Proof</h3></div>
        <div class="feedback-card" onclick="openChat('Gaming')"><h3>Gaming Feedback</h3></div>
    </div>

    <div id="chat-container">
        <h3 id="chat-title">Chat</h3>
        <div id="messages"></div>
        <input type="text" id="msg-input" placeholder="Type..." style="width: 70%; padding: 8px;">
        <button id="send-btn">SEND</button>
        <input type="file" id="file-upload">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBKpXQ9MWJ-6a1NSnKlhrLdxXfu8i6BYkE",
            databaseURL: "https://crimson-devil-world-default-rtdb.firebaseio.com",
            storageBucket: "crimson-devil-world.firebasestorage.app",
            projectId: "crimson-devil-world"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        // Menu Toggle
        document.getElementById('menuToggle').onclick = function() {
            this.classList.toggle('active');
            document.getElementById('sidebar').classList.toggle('active');
        };

        window.openChat = (title) => {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('chat-container').style.display = 'block';
            document.getElementById('chat-title').innerText = title;
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('menuToggle').classList.remove('active');
        };

        // Send Msg
        document.getElementById('send-btn').onclick = () => {
            const input = document.getElementById('msg-input');
            if(input.value) push(ref(db, 'chats/general'), { user: "C4CRIMSON", text: input.value, time: serverTimestamp() });
            input.value = "";
        };

        // Display Msgs
        onChildAdded(ref(db, 'chats/general'), (s) => {
            const d = s.val();
            document.getElementById('messages').innerHTML += `<div><b>${d.user}:</b> ${d.text}</div>`;
        });

        // File Upload
        document.getElementById('file-upload').onchange = async (e) => {
            const file = e.target.files[0];
            const fileRef = sRef(storage, 'uploads/' + file.name);
            await uploadBytes(fileRef, file);
            const url = await getDownloadURL(fileRef);
            push(ref(db, 'chats/general'), { user: "C4CRIMSON", text: "File: " + url });
            alert("File sent!");
        };
    </script>
</body>
</html>
