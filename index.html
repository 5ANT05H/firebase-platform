<!DOCTYPE html>
<html>
<head>
  <title>CRIMSON PLATFORM</title>
</head>

<body style="font-family: Arial; text-align:center; background:#111; color:white;">

<h1>🔥 CRIMSON PLATFORM</h1>

<button id="loginBtn">Login with Google</button>
<button id="logoutBtn" style="display:none;">Logout</button>

<p id="info">Not logged in</p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { 
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAwyFcuUfpvu4DcXRMF-7VNPr6v39MniRU",
  authDomain: "crimson-platform-92f67.firebaseapp.com",
  projectId: "crimson-platform-92f67",
  storageBucket: "crimson-platform-92f67.firebasestorage.app",
  appId: "1:7775873440:web:b81205d0d1e84e12f3dcc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const OWNER_EMAIL = "tksantosh0@gmail.com";

/* BUTTONS */
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const info = document.getElementById("info");

/* LOGIN */
loginBtn.onclick = async () => {
  const provider = new GoogleAuthProvider();
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    alert(e.message);
  }
};

/* LOGOUT */
logoutBtn.onclick = () => {
  signOut(auth);
};

/* STATE */
onAuthStateChanged(auth, (user) => {

  if(user){
    let role = (user.email === OWNER_EMAIL) ? "HEAD OWNER" : "USER";

    info.innerText = `Logged in: ${user.email} | Role: ${role}`;
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
  }
  else{
    info.innerText = "Not logged in";
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";
  }
});

</script>

</body>
</html>
