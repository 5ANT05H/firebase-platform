<!DOCTYPE html>
<html>
<head>
  <title>FIX LOGIN SYSTEM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin:0;background:#0a0a0a;color:white;font-family:Arial;">

<div id="app">Loading...</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAwyFcuUfpvu4DcXRMF-7VNPr6v39MniRU",
  authDomain: "crimson-platform-92f67.firebaseapp.com",
  projectId: "crimson-platform-92f67",
  storageBucket: "crimson-platform-92f67.firebasestorage.app",
  appId: "1:7775873440:web:b81205d0d1e84e12f3dcc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const appDiv = document.getElementById("app");

/* SHOW LOGIN */
function showLogin(){
  appDiv.innerHTML = `
    <h1>🔥 LOGIN PAGE</h1>

    <button id="loginBtn" style="padding:10px;">
      Login with Google
    </button>

    <p id="status">Not logged in</p>
  `;

  document.getElementById("loginBtn").onclick = async () => {
    try {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
    } catch (e) {
      alert("Login Error: " + e.message);
    }
  };
}

/* DASHBOARD */
function showDashboard(user){

  appDiv.innerHTML = `
    <h1>🔥 DASHBOARD</h1>

    <h3>👤 ${user.email}</h3>

    <p>Status: ONLINE 🟢</p>

    <button onclick="logout()">Logout</button>
  `;
}

/* LOGOUT */
window.logout = function(){
  signOut(auth);
};

/* AUTH STATE FIX */
onAuthStateChanged(auth, (user) => {

  console.log("AUTH STATE:", user);

  if(user){
    showDashboard(user);
  } else {
    showLogin();
  }

});

</script>

</body>
</html>
