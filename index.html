<!DOCTYPE html>
<html>
<head>
  <title>FULL FIREBASE PLATFORM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin:0;font-family:Arial;background:#0b0b0b;color:white;">

<div id="app">Loading...</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAwyFcuUfpvu4DcXRMF-7VNPr6v39MniRU",
  authDomain: "crimson-platform-92f67.firebaseapp.com",
  projectId: "crimson-platform-92f67",
  storageBucket: "crimson-platform-92f67.firebasestorage.app",
  appId: "1:7775873440:web:b81205d0d1e84e12f3dcc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const appDiv = document.getElementById("app");

const OWNER = "tksantosh0@gmail.com";

/* CREATE USER */
async function createUser(user){

  const ref = doc(db,"users",user.email);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    await setDoc(ref,{
      email:user.email,
      role:"USER",
      premium:false,
      createdAt:Date.now()
    });
  }

  return (await getDoc(ref)).data();
}

/* LOGIN UI */
function loginUI(){

  appDiv.innerHTML = `
    <h1>🔥 LOGIN</h1>
    <button id="loginBtn">Login with Google</button>
  `;

  document.getElementById("loginBtn").onclick = async () => {
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
  };
}

/* DASHBOARD */
function dashboard(user,data){

  let role = "USER";
  if(user.email === OWNER) role = "OWNER";
  else if(data.role === "ADMIN") role = "ADMIN";

  appDiv.innerHTML = `
    <h2>👤 ${user.email}</h2>
    <h3>Role: ${role}</h3>
    <h3>💎 Premium: ${data.premium ? "YES" : "NO"}</h3>

    <button onclick="logout()">Logout</button>

    <hr>

    <h2>💬 CHAT</h2>

    <input id="msg" placeholder="type message">
    <button onclick="sendMsg()">Send</button>

    <div id="chatBox"></div>

    <hr>

    <button onclick="makePremium()">Make Premium</button>
    <button onclick="makeAdmin()">Make Admin</button>
  `;

  loadChat();
}

/* AUTH */
onAuthStateChanged(auth, async (user)=>{

  if(user){
    const data = await createUser(user);
    dashboard(user,data);
  } else {
    loginUI();
  }

});

/* LOGOUT */
window.logout = () => signOut(auth);

/* SEND MSG */
window.sendMsg = async function(){

  let msg = document.getElementById("msg").value;
  if(!msg) return;

  await addDoc(collection(db,"chat"),{
    text:msg,
    email:auth.currentUser.email,
    time:Date.now()
  });

  document.getElementById("msg").value="";
};

/* LOAD CHAT */
function loadChat(){

  const q = query(collection(db,"chat"),orderBy("time"));

  onSnapshot(q,(snap)=>{

    let html="";

    snap.forEach(d=>{
      html += `<p><b>${d.data().email}:</b> ${d.data().text}</p>`;
    });

    document.getElementById("chatBox").innerHTML = html;

  });

}

/* PREMIUM */
window.makePremium = async function(){

  await setDoc(doc(db,"users",auth.currentUser.email),{
    premium:true
  },{merge:true});

  alert("Premium Activated ✔");
};

/* ADMIN */
window.makeAdmin = async function(){

  await setDoc(doc(db,"users",auth.currentUser.email),{
    role:"ADMIN"
  },{merge:true});

  alert("Admin Activated ✔");
};

</script>

</body>
</html>
