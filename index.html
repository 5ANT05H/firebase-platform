<!DOCTYPE html>
<html>
<head>
  <title>CRIMSON PLATFORM</title>
</head>

<body style="font-family: Arial; text-align:center; background:#111; color:white;">

<h1>🔥 CRIMSON PLATFORM</h1>

<div id="app"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { 
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAwyFcuUfpvu4DcXRMF-7VNPr6v39MniRU",
  authDomain: "crimson-platform-92f67.firebaseapp.com",
  projectId: "crimson-platform-92f67",
  storageBucket: "crimson-platform-92f67.firebasestorage.app",
  messagingSenderId: "7775873440",
  appId: "1:7775873440:web:b81205d0d1e84e12f3dcc5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const OWNER_EMAIL = "tksantosh0@gmail.com";

const appDiv = document.getElementById("app");

/* LOGIN */
window.login = function(){
  const provider = new GoogleAuthProvider();
  signInWithRedirect(auth, provider);
};

/* LOGOUT */
window.logout = function(){
  signOut(auth);
};

/* HANDLE REDIRECT RESULT (IMPORTANT) */
getRedirectResult(auth).catch(() => {});

/* STATE CONTROL (NO CRASH METHOD) */
onAuthStateChanged(auth, (user) => {

  if(user){
    let role = (user.email === OWNER_EMAIL) ? "HEAD OWNER" : "USER";

    appDiv.innerHTML = `
      <h2>🔥 DASHBOARD</h2>
      <p>👤 ${user.email}</p>
      <p>Role: ${role}</p>
      <button onclick="logout()">Logout</button>
    `;
  }
  else{
    appDiv.innerHTML = `
      <button onclick="login()">Login with Google</button>
      <p>Not logged in</p>
    `;
  }
});

</script>

</body>
</html>
