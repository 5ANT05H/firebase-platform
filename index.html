<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRIMSON DEVIL WORLD UI</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0a0a0a;
  color:white;
}

/* TOP BAR */
.topbar{
  height:55px;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  border-bottom:2px solid red;
}

.logo{
  color:red;
  font-weight:bold;
}

/* MAIN LAYOUT */
.container{
  display:flex;
  height:calc(100vh - 55px);
}

/* LEFT SIDEBAR */
.left{
  width:240px;
  background:#111;
  border-right:2px solid red;
  padding:10px;
  overflow:auto;
}

.menu-item{
  padding:12px;
  margin:5px 0;
  background:#000;
  border:1px solid #222;
  cursor:pointer;
}

.menu-item:hover{
  background:red;
}

/* CHAT AREA */
.chat{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:10px;
}

.chat-box{
  flex:1;
  background:#111;
  border:1px solid red;
  padding:10px;
  overflow:auto;
}

.msg{
  margin:8px 0;
  padding:8px;
  background:#000;
  border-left:3px solid red;
}

/* INPUT */
.input-box{
  display:flex;
  margin-top:10px;
}

input{
  flex:1;
  padding:12px;
  background:#000;
  border:1px solid red;
  color:white;
}

button{
  padding:12px 15px;
  background:red;
  border:none;
  color:white;
  cursor:pointer;
}

/* RIGHT PANEL */
.right{
  width:280px;
  background:#111;
  border-left:2px solid red;
  padding:10px;
  overflow:auto;
}

.user{
  padding:10px;
  background:#000;
  margin:5px 0;
  border:1px solid #222;
}

.badge{
  font-size:11px;
  padding:3px 6px;
  border-radius:4px;
  margin-left:5px;
}

.owner{background:gold;color:black;}
.admin{background:orange;}
.userb{background:gray;}

/* PANEL BOX */
.panel{
  margin-top:15px;
  padding:10px;
  background:#000;
  border:1px solid red;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="logo">🔥 CRIMSON DEVIL WORLD</div>
  <div>🟢 LIVE</div>
</div>

<div class="container">

  <!-- LEFT -->
  <div class="left">
    <div class="menu-item">🏠 Home</div>
    <div class="menu-item">🌍 Public Chat</div>
    <div class="menu-item">⚙ Admin Chat</div>
    <div class="menu-item">👑 Owner Chat</div>
    <div class="menu-item">💎 Premium</div>
    <div class="menu-item">📦 Mods</div>
  </div>

  <!-- CHAT -->
  <div class="chat">
    <div class="chat-box" id="box">
      <div class="msg"><b>Owner:</b> Welcome to CRIMSON DEVIL WORLD 🔥</div>
      <div class="msg"><b>Admin:</b> Mods uploaded ✔</div>
      <div class="msg"><b>User:</b> Nice UI bro 💯</div>
    </div>

    <div class="input-box">
      <input placeholder="Type message...">
      <button>Send</button>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">

    <h3>🟢 Online Users</h3>

    <div class="user">CRIMSON OWNER <span class="badge owner">OWNER</span></div>
    <div class="user">Shadow Ninja <span class="badge admin">ADMIN</span></div>
    <div class="user">Devil Hunter <span class="badge userb">USER</span></div>
    <div class="user">Silent Killer <span class="badge userb">USER</span></div>

    <div class="panel">
      <h4>👑 Owner Panel</h4>
      <button style="width:100%;margin:5px 0;">Ban User</button>
      <button style="width:100%;margin:5px 0;">Unban User</button>
      <button style="width:100%;margin:5px 0;">Delete Msg</button>
    </div>

  </div>

</div>

</body>
</html>
