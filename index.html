<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DEVIL WORLD FULL SYSTEM</title>

<style>
body{
margin:0;
background:black;
color:white;
font-family:Arial;
}

#auth{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

button{
padding:10px;
margin:5px;
background:red;
color:white;
border:none;
cursor:pointer;
}

#app{
display:none;
padding:20px;
}

.card{
background:#111;
padding:15px;
margin:10px;
border:1px solid red;
}

#chatBox{
height:200px;
overflow:auto;
background:#000;
border:1px solid red;
padding:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="auth">
<h2>💀 DEVIL WORLD</h2>
<button onclick="login()">LOGIN WITH GOOGLE</button>
</div>

<!-- APP -->
<div id="app">

<h3 id="userInfo"></h3>

<!-- VOTE -->
<div class="card">
<h3>🔥 VOTE SYSTEM</h3>
<button onclick="vote('like')">👍 LIKE</button>
<button onclick="vote('dislike')">👎 DISLIKE</button>
<p id="votes"></p>
</div>

<!-- CHAT -->
<div class="card">
<h3>💬 PUBLIC CHAT</h3>

<div id="chatBox"></div>

<input id="msg" placeholder="type message">
<button onclick="sendMsg()">SEND</button>

</div>

</div>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
updateDoc,
increment,
collection,
addDoc,
query,
orderBy,
onSnapshot
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
apiKey: "AIzaSyAwyFcuUfpvu4DcXRMF-7VNPr6v39MniRU",
authDomain: "crimson-platform-92f67.firebaseapp.com",
projectId: "crimson-platform-92f67"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

/* OWNER */
const OWNER_EMAIL = "tksantosh0@gmail.com";

let currentUser;

/* LOGIN */
window.login = async function(){

const res = await signInWithPopup(auth, provider);
const user = res.user;

currentUser = user;

let role = "USER";
if(user.email === OWNER_EMAIL){
role = "HEAD OWNER 👑";
}

document.getElementById("auth").style.display="none";
document.getElementById("app").style.display="block";

document.getElementById("userInfo").innerText =
user.displayName + " | " + role;

initVote();
loadChat();

};

/* VOTE */
async function initVote(){
const ref = doc(db,"posts","main");
const snap = await getDoc(ref);

if(!snap.exists()){
await setDoc(ref,{likes:0,dislikes:0});
}

loadVoteUI();
}

async function loadVoteUI(){
const ref = doc(db,"posts","main");
const snap = await getDoc(ref);
let d = snap.data();

document.getElementById("votes").innerText =
"👍 "+d.likes+" | 👎 "+d.dislikes;
}

window.vote = async function(type){

const ref = doc(db,"posts","main");

if(type==="like"){
await updateDoc(ref,{likes:increment(1)});
}else{
await updateDoc(ref,{dislikes:increment(1)});
}

loadVoteUI();

};

/* CHAT */
window.sendMsg = async function(){

let text = document.getElementById("msg").value;
if(!text) return;

await addDoc(collection(db,"chat"),{
text:text,
name:currentUser.displayName,
time:Date.now()
});

document.getElementById("msg").value="";
};

/* LOAD CHAT */
function loadChat(){

const q = query(collection(db,"chat"),orderBy("time"));

onSnapshot(q,(snap)=>{

let html="";

snap.forEach(doc=>{
let d=doc.data();
html += `<p><b>${d.name}:</b> ${d.text}</p>`;
});

document.getElementById("chatBox").innerHTML = html;

});

}

</script>

</body>
</html>
