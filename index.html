<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Crimson 404 - Premium Dashboard</title>
    <style>
        /* CSS सेक्शन: यहाँ आप 500+ लाइन्स का स्टाइल लिख सकते हैं */
        body { background: #050505; color: #ff0000; font-family: 'Courier New', Courier, monospace; margin: 0; }
        
        /* ब्लडी टाइटल इफ़ेक्ट */
        .bloody-title { text-align: center; font-size: 80px; text-shadow: 2px 2px 5px red; animation: drip 2s infinite; }
        @keyframes drip { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }

        /* नेविगेशन */
        .nav-menu { background: #110000; padding: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
        .nav-btn { color: white; cursor: pointer; padding: 10px; border: 1px solid #ff0000; transition: 0.3s; }
        .nav-btn:hover { background: #ff0000; color: black; }

        /* फीडबैक कार्ड्स */
        .feedback-grid { display: flex; justify-content: space-between; padding: 50px; }
        .card { width: 30%; border: 2px solid #550000; padding: 20px; text-align: center; background: #0a0000; }
        
        /* चैट और बाकी सेक्शन्स के लिए स्टाइल... */
    </style>
</head>
<body>

    <div class="nav-menu">
        <div class="nav-btn" onclick="show('home')">HOME</div>
        <div class="nav-btn" onclick="show('head-owner')">HEAD OWNER</div>
        <div class="nav-btn" onclick="show('owner')">OWNER</div>
        <div class="nav-btn" onclick="show('admin')">ADMIN</div>
        <div class="nav-btn" onclick="show('premium')">PREMIUM CHAT</div>
        <div class="nav-btn" onclick="show('public')">PUBLIC CHAT</div>
        <div class="nav-btn" onclick="show('leaderboard')">LEADERBOARD</div>
        <div class="nav-btn" onclick="show('about')">ABOUT</div>
        <div class="nav-btn" onclick="show('contact')">CONTACT US</div>
        <div class="nav-btn" onclick="show('support')">SUPPORT</div>
    </div>

    <div id="home" class="content">
        <h1 class="bloody-title">CRIMSON 404</h1>
        <div class="feedback-grid">
            <div class="card"><h3>FEEDBACK</h3><p>Upload here...</p></div>
            <div class="card"><h3>PAYMENT PROOF</h3><p>Upload here...</p></div>
            <div class="card"><h3>GAMING FEEDBACK</h3><p>Upload here...</p></div>
        </div>
    </div>

    <script>
        function show(id) {
            // यहाँ 200+ लाइन का JavaScript लॉजिक (Access Control) लिख सकते हैं
            console.log("Navigating to: " + id);
        }
    </script>
</body>
</html>
