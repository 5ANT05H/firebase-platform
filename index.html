<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getAuth, 
  GoogleAuthProvider, 
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAZHtBlagfvIDUOSkI_zi7WEKJFk6S_fCA",
  authDomain: "crimsonseling.firebaseapp.com",
  projectId: "crimsonseling",
  storageBucket: "crimsonseling.firebasestorage.app",
  appId: "1:937988013541:web:7ad4f06203d596e641430c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const OWNER_EMAIL = "tksantosh0@gmail.com";

/* LOGIN */
window.login = function(){
  const provider = new GoogleAuthProvider();

  signInWithPopup(auth, provider)
  .catch(err => alert(err.message));
};

/* LOGOUT */
window.logout = function(){
  signOut(auth);
};

/* ONLY ONE RENDER SYSTEM */
let rendered = false;

onAuthStateChanged(auth, (user) => {

  if(rendered) return;   // ❗ STOP LOOP
  rendered = true;

  if(user){
    showDashboard(user);
  } else {
    showLogin();
  }
});

/* LOGIN UI */
function showLogin(){
  document.body.innerHTML = `
    <h1>🔥 LOGIN SYSTEM</h1>
    <button onclick="login()">Login with Google</button>
  `;
}

/* DASHBOARD */
function showDashboard(user){

  let role = (user.email === OWNER_EMAIL) ? "head_owner" : "user";

  document.body.innerHTML = `
    <h1>🔥 DASHBOARD</h1>

    <h2>👤 ${user.email}</h2>
    <h3>Role: ${role}</h3>

    <button onclick="logout()">Logout</button>
  `;
}

</script>
