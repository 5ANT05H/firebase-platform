<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crimson Devil World</title>
    <style>
        /* बेसिक स्टाइलिंग */
        body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #2a2a2a; padding: 20px; border-radius: 10px; }
        .hidden { display: none; }
        input, button, select { padding: 10px; margin: 5px 0; border-radius: 5px; border: none; width: 100%; box-sizing: border-box; }
        button { background-color: #007bff; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        
        /* नेविगेशन बार */
        .nav-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-bar button { flex: 1; background-color: #444; }
        .nav-bar button:hover { background-color: #666; }
        
        /* चैट बॉक्स स्टाइल */
        .chat-box { height: 300px; background: #111; overflow-y: auto; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .message { background: #333; padding: 8px; margin-bottom: 5px; border-radius: 5px; }
        .controls-row { display: flex; gap: 5px; }
        
        /* लीडरबोर्ड टेबल */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #444; text-align: left; }
        th { background-color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="app-title">Login to System</h2>

    <div id="login-section">
        <label>Username:</label>
        <input type="text" id="login-username" placeholder="Enter Username">
        <label>Password:</label>
        <input type="password" id="login-password" placeholder="Enter Password">
        <button id="btn-login">Login</button>
        <p id="login-error" style="color: red; display: none;">Invalid Username or Password</p>
    </div>

    <div id="dashboard-section" class="hidden">
        <div class="nav-bar">
            <button id="tab-chat">Chats</button>
            <button id="tab-leaderboard">Leaderboard</button>
            <button id="tab-settings">Settings</button>
            <button id="btn-logout" style="background-color: #dc3545;">Logout</button>
        </div>

        <div id="chat-tab">
            <h3>Select Chat Room</h3>
            <select id="chat-room-select">
                <option value="public_chat">Public Chat</option>
                <option value="admin_chat">Admin Chat</option>
                <option value="premium_chat">Premium Chat</option>
                <option value="owner_chat">Owner Chat</option>
                <option value="head_owner_chat">Head Owner Chat</option>
            </select>
            
            <p id="access-denied-msg" style="color: red; display: none;">You do not have permission to view this chat.</p>
            
            <div id="chat-interface">
                <div class="chat-box" id="chat-messages"></div>
                <div class="controls-row">
                    <button id="btn-emoji" style="flex: 1;">😀 Emoji</button>
                    <button id="btn-photo" style="flex: 1;">📷 Photo</button>
                    <button id="btn-file" style="flex: 1; display: none; background-color: #28a745;">📁 File Upload</button>
                </div>
                <div class="controls-row" style="margin-top: 5px;">
                    <input type="text" id="chat-input" placeholder="Type a message..." style="flex: 4;">
                    <button id="btn-send" style="flex: 1;">Send</button>
                </div>
            </div>
        </div>

        <div id="leaderboard-tab" class="hidden">
            <h3>Live Leaderboard (Top 100)</h3>
            <table>
                <thead>
                    <tr>
                        <th>RANK</th>
                        <th>PLAYER IGN</th>
                        <th>CRIMSON POINTS</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>

        <div id="settings-tab" class="hidden">
            <h3>User Settings</h3>
            <label>Update Username:</label>
            <input type="text" id="new-username" placeholder="Enter new username">
            <button id="btn-save-settings">Save Username</button>
            <p id="settings-msg" style="color: lightgreen; display: none;">Username updated successfully!</p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getDatabase, ref, set, update, get, orderByChild, equalTo, query, limitToLast, onValue } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    // आपकी दी हुई Firebase कॉन्फ़िगरेशन
    const firebaseConfig = {
        apiKey: "AIzaSyBKpXQ9MWJ-6a1NSnKlhrLdxXfu8i6BYkE",
        authDomain: "crimson-devil-world.firebaseapp.com",
        databaseURL: "https://crimson-devil-world-default-rtdb.firebaseio.com",
        projectId: "crimson-devil-world",
        storageBucket: "crimson-devil-world.firebasestorage.app",
        messagingSenderId: "625125480692",
        appId: "1:625125480692:web:cf7dc8b4a8d7cac82c66a1",
        measurementId: "G-RGE649JWLV"
    };

    // Firebase Initialize करें
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // ग्लोबल स्टेट वेरिएबल्स
    let currentUser = null;
    let currentUserKey = null;

    const roles = {
        HEAD_OWNER: 'head_owner',
        OWNER: 'owner',
        ADMIN: 'admin',
        PREMIUM: 'premium_user',
        USER: 'user'
    };

    // DOM एलिमेंट्स को कैप्चर करना
    const loginBtn = document.getElementById('btn-login');
    const logoutBtn = document.getElementById('btn-logout');
    const sendBtn = document.getElementById('btn-send');
    const saveSettingsBtn = document.getElementById('btn-save-settings');
    const chatRoomSelect = document.getElementById('chat-room-select');

    // टैब बटन्स
    document.getElementById('tab-chat').addEventListener('click', () => showTab('chat-tab'));
    document.getElementById('tab-leaderboard').addEventListener('click', () => showTab('leaderboard-tab'));
    document.getElementById('tab-settings').addEventListener('click', () => showTab('settings-tab'));

    // इवेंट लिस्टनर्स जोड़ना
    loginBtn.addEventListener('click', loginWithUsername);
    logoutBtn.addEventListener('click', logout);
    sendBtn.addEventListener('click', sendMessage);
    saveSettingsBtn.addEventListener('click', updateSettingsUsername);
    chatRoomSelect.addEventListener('change', loadChatRoom);

    // 1. LOGIN LOGIC (Firebase v12 Query)
    async function loginWithUsername() {
        const usernameInput = document.getElementById('login-username').value.trim();
        const passwordInput = document.getElementById('login-password').value;
        const errorMsg = document.getElementById('login-error');

        if (!usernameInput || !passwordInput) {
            alert("Please fill in all fields.");
            return;
        }

        try {
            const usersRef = ref(database, 'users');
            // यूजरनेम के आधार पर क्वेरी बनाना
            const userQuery = query(usersRef, orderByChild('username'), equalTo(usernameInput));
            const snapshot = await get(userQuery);

            if (snapshot.exists()) {
                let passwordMatch = false;
                
                snapshot.forEach((childSnapshot) => {
                    const userData = childSnapshot.val();
                    if (userData.password === passwordInput) {
                        currentUser = userData;
                        currentUserKey = childSnapshot.key;
                        passwordMatch = true;
                        showDashboard();
                    }
                });

                if (!passwordMatch) {
                    errorMsg.style.display = 'block';
                }
            } else {
                errorMsg.style.display = 'block';
            }
        } catch (error) {
            console.error("Login Error: ", error);
            alert("Database Error. Check your console log.");
        }
    }

    function showDashboard() {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        document.getElementById('app-title').innerText = "Dashboard - Welcome " + currentUser.username;
        document.getElementById('login-error').style.display = 'none';
        loadChatRoom(); 
        fetchLiveLeaderboard(); 
    }

    function logout() {
        currentUser = null;
        currentUserKey = null;
        document.getElementById('dashboard-section').classList.add('hidden');
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('app-title').innerText = "Login to System";
        document.getElementById('login-username').value = '';
        document.getElementById('login-password').value = '';
    }

    // 2. TAB NAVIGATION
    function showTab(tabId) {
        document.getElementById('chat-tab').classList.add('hidden');
        document.getElementById('leaderboard-tab').classList.add('hidden');
        document.getElementById('settings-tab').classList.add('hidden');
        document.getElementById(tabId).classList.remove('hidden');
    }

    // 3. CHAT PERMISSIONS & MEDIA RULES
    function loadChatRoom() {
        const room = chatRoomSelect.value;
        const interfaceDiv = document.getElementById('chat-interface');
        const deniedMsg = document.getElementById('access-denied-msg');
        
        let hasAccess = false;
        const userRole = currentUser.role || 'user';

        switch (room) {
            case 'head_owner_chat':
                hasAccess = [roles.HEAD_OWNER, roles.OWNER].includes(userRole); break;
            case 'owner_chat':
                hasAccess = [roles.HEAD_OWNER, roles.OWNER, roles.ADMIN].includes(userRole); break;
            case 'admin_chat':
                hasAccess = true; break; 
            case 'premium_chat':
                hasAccess = [roles.HEAD_OWNER, roles.OWNER, roles.ADMIN, roles.PREMIUM].includes(userRole); break;
            case 'public_chat':
                hasAccess = true; break;
        }

        if (hasAccess) {
            interfaceDiv.style.display = 'block';
            deniedMsg.style.display = 'none';
            applyMediaRules(room);
            document.getElementById('chat-messages').innerHTML = `<div class="message">Welcome to ${room.replace('_', ' ')}</div>`;
        } else {
            interfaceDiv.style.display = 'none';
            deniedMsg.style.display = 'block';
        }
    }

    function applyMediaRules(room) {
        const fileBtn = document.getElementById('btn-file');
        const allowedFileChats = ['head_owner_chat', 'owner_chat', 'admin_chat'];
        
        if (allowedFileChats.includes(room)) {
            fileBtn.style.display = 'block';
        } else {
            fileBtn.style.display = 'none';
        }
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        if (input.value.trim() !== '') {
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML += `<div class="message"><b>${currentUser.username}:</b> ${input.value}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    // 4. LIVE LEADERBOARD (Top 100 Auto-Update Logic)
    function fetchLiveLeaderboard() {
        const usersRef = ref(database, 'users');
        const leaderboardQuery = query(usersRef, orderByChild('crimson_points'), limitToLast(100));
        
        // onValue लाइव डेटा ट्रैक करता रहेगा अपने आप चेंज होने पर
        onValue(leaderboardQuery, (snapshot) => {
            let data = [];
            snapshot.forEach((child) => {
                data.push(child.val());
            });
            data.reverse(); 
            
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            
            data.forEach((user, index) => {
                const row = `<tr>
                    <td>#${index + 1}</td>
                    <td>${user.username || 'Unknown'}</td>
                    <td>${user.crimson_points || 0}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        });
    }

    // 5. SETTINGS (UPDATE USERNAME)
    async function updateSettingsUsername() {
        const newName = document.getElementById('new-username').value.trim();
        const settingsMsg = document.getElementById('settings-msg');
        
        if (newName === '') {
            alert("Please enter a valid username.");
            return;
        }

        if (currentUserKey) {
            try {
                const userRef = ref(database, 'users/' + currentUserKey);
                await update(userRef, { username: newName });
                
                currentUser.username = newName;
                document.getElementById('app-title').innerText = "Dashboard - Welcome " + currentUser.username;
                settingsMsg.style.display = 'block';
                document.getElementById('new-username').value = '';
                
                setTimeout(() => { settingsMsg.style.display = 'none'; }, 3000);
            } catch (error) {
                console.error("Error updating username: ", error);
                alert("Failed to update username in database.");
            }
        }
    }
</script>

</body>
</html>
