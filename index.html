<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CRIMSON DEVIL WORLD FIX</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050505;
color:white;
}

#auth{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#111;
padding:20px;
width:320px;
border:1px solid red;
text-align:center;
box-shadow:0 0 15px red;
}

input,button{
padding:10px;
margin:5px;
width:90%;
}

button{
background:red;
color:white;
border:none;
cursor:pointer;
}

#app{display:none}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">

<!-- REGISTER -->
<div id="registerBox" class="box">

<h2>REGISTER</h2>

<input id="r_user" placeholder="username">
<input id="r_pass" placeholder="password">
<input id="r_cpass" placeholder="confirm password">
<input id="r_email" placeholder="gmail">

<button onclick="register()">REGISTER</button>

<p onclick="showLogin()" style="color:red;cursor:pointer;">
Already have account? LOGIN
</p>

</div>

<!-- LOGIN -->
<div id="loginBox" class="box" style="display:none;">

<h2>LOGIN</h2>

<input id="l_user" placeholder="username">
<input id="l_pass" type="password" placeholder="password">

<button onclick="login()">LOGIN</button>

<p onclick="showRegister()" style="color:red;cursor:pointer;">
Create new account? REGISTER
</p>

</div>

</div>

<!-- APP -->
<div id="app">
<h2 id="userInfo"></h2>
</div>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
getFirestore,
doc,
getDoc,
setDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyAwyFcuUfpvu4DcXRMF-7VNPr6v39MniRU",
projectId:"crimson-platform-92f67"
});

const db=getFirestore(app);

let currentUser=null;

/* SWITCH UI */
window.showLogin=function(){
registerBox.style.display="none";
loginBox.style.display="block";
};

window.showRegister=function(){
loginBox.style.display="none";
registerBox.style.display="block";
};

/* REGISTER */
window.register=async function(){

try{

if(!r_user.value || !r_pass.value){
alert("Fill all fields");
return;
}

if(r_pass.value !== r_cpass.value){
alert("Password not match");
return;
}

await setDoc(doc(db,"users",r_user.value),{
username:r_user.value,
password:r_pass.value,
email:r_email.value,
role:"USER"
});

alert("REGISTER SUCCESS ✔");

showLogin();

}catch(e){
console.log(e);
alert("REGISTER ERROR");
}

};

/* LOGIN */
window.login=async function(){

try{

let snap = await getDoc(doc(db,"users",l_user.value));

if(!snap.exists()){
alert("User not found");
return;
}

let d = snap.data();

if(d.password !== l_pass.value){
alert("Wrong password");
return;
}

currentUser = d;

document.getElementById("auth").style.display="none";
document.getElementById("app").style.display="block";

userInfo.innerText = "👤 " + currentUser.username;

}catch(e){
console.log(e);
alert("LOGIN ERROR");
}

};

</script>

</body>
</html>
