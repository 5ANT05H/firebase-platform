<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crimson Dark Devil World</title>
    <style>
        /* =======================================================
           STEP 1: HOME PAGE & BASIC THEME (डार्क और क्रिमसन थीम)
           ======================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0c;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* होम पेज स्टाइल */
        .home-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            background: radial-gradient(circle, #2a0808 0%, #0b0b0c 100%);
        }

        .welcome-title {
            font-size: 3rem;
            color: #ff3333;
            text-shadow: 0 0 20px rgba(255, 51, 51, 0.6);
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* मेन्यू की तरफ इशारा करने वाला एरो */
        .menu-arrow {
            font-size: 1.5rem;
            color: #888;
            margin-top: 20px;
            animation: bounce 2s infinite;
            cursor: pointer;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(0); }
            40% { transform: translateX(-10px); }
            60% { transform: translateX(-5px); }
        }

        /* थ्री-लाइन (हम्बर्गर) बटन */
        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 24px;
            background: none;
            border: none;
            color: #ff3333;
            cursor: pointer;
            z-index: 100;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }
